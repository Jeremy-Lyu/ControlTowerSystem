- metric_id: unit_cost
  name: 单车转换成本
  domain: 成本
  level: 集团
  grain: group_or_plant
  definition: 统计期内转换成本摊到每台下线车。转换成本按 VCS 17 个科目，不含材料。
  formula: Σ VCS 科目成本 ÷ 下线车数
  sql: SELECT cost_total / prod_qty FROM dws_plant_month / dws_group_month
  source: ERP（成本中心/科目）、MES、VCS测算结果
  refresh: 月（日预估）
  owner_role: 集团财务-成本控制经理
  it_role: 数据平台工程师
  dq_rule: 成本中心→VCS 科目映射完整；分母>0；与 VCS 测算偏差 >±5% 告警
  direction: down
  unit: 元/台
  target_text: = VCS 月度测算
  warn_text: 超测算 5%
  example_text: 集团 ¥5,202 vs ¥4,980；A工厂 ¥5,512 vs ¥4,997
- metric_id: cost_mix
  name: 转换成本构成占比
  domain: 成本
  level: 集团
  grain: plant
  definition: VCS 科目归并为 人工 / 加班 / 能源 / OH / 折旧 / 班车+外包 / 其他 后各占转换成本的比例
  formula: 分组科目成本 ÷ 转换成本合计
  sql: SELECT grp, SUM(amount)/SUM(SUM(amount)) FROM dws_cost_account_month GROUP
    BY grp
  source: ERP（成本中心）
  refresh: 月
  owner_role: 集团财务-成本控制经理
  it_role: 数据平台工程师
  dq_rule: 各组之和=100%
  direction: watch
  unit: '%'
  target_text: 监控项（无目标）
  warn_text: —
- metric_id: ach_rate
  name: 产量达成率
  domain: 计划交付
  level: 集团
  grain: group_or_plant
  definition: 实际下线车数与 VCS 冻结版需求之比
  formula: 实际下线车数 ÷ VCS 需求（冻结版）
  sql: SELECT prod_qty*100.0/plan_qty FROM dws_plant_month
  source: MES、计划排产、VCS测算结果
  refresh: 小时
  owner_role: 集团生产计划经理
  it_role: 数据平台工程师
  dq_rule: 计划取冻结版本；结果在0–120%之间
  direction: up
  unit: '%'
  target_text: ≥98%
  warn_text: 96%
  example_text: A工厂 94.0%；集团 96.9%
- metric_id: otd
  name: 准时交付率
  domain: 计划交付
  level: 集团
  grain: group_or_plant
  definition: 按承诺日期完成交付的订单比例
  formula: 按期交付订单数 ÷ 应交付订单数
  sql: SELECT otd_num*100.0/otd_den FROM dws_plant_month
  source: ERP（销售订单/发运）
  refresh: 日
  owner_role: 集团物流/销售运营经理
  it_role: ERP接口工程师
  dq_rule: 承诺日期非空
  direction: up
  unit: '%'
  target_text: ≥95%
  warn_text: 93%
- metric_id: elec_kwh
  name: 单车电耗（集团）
  domain: 能源
  level: 集团
  grain: group_or_plant
  definition: VCS 电量口径：固定（运行功率×开动小时）+ 加班（功率×加班小时）+ 变动（单车电耗×产量），摊到每台下线车
  formula: (Σ功率×开动小时 + Σ功率×加班小时 + Σ单车电耗×产量) ÷ 下线车数
  sql: SELECT elec_kwh/prod_qty FROM dws_plant_month
  source: 能源计量（电表）、MES、VCS测算结果
  refresh: 日
  owner_role: 集团能源管理经理
  it_role: 数据平台工程师
  dq_rule: 电表-车间映射完整；与 VCS 测算偏差 >±5% 告警
  direction: down
  unit: kWh/台
  target_text: = VCS 测算
  warn_text: 超测算 5%
- metric_id: hpv
  name: 单车工时（HPV）
  domain: 人力
  level: 集团/工厂
  grain: group_or_plant
  definition: 每台下线车消耗的出勤工时与加班工时（VCS 口径 HPV）
  formula: (在册×工作日×8h×出勤率 + 加班人·h) ÷ 下线车数
  sql: SELECT (present_h + ot_h)/prod_qty FROM dws_plant_month
  source: HR考勤排班、MES
  refresh: 日
  owner_role: 集团工业工程经理
  it_role: 数据平台工程师
  dq_rule: 工时与排班人数对账一致
  direction: down
  unit: h/台
  target_text: = VCS 测算（示例 A工厂 ≤32.1）
  warn_text: 超测算 5%
- metric_id: warranty
  name: 保修索赔率（3MIS）
  domain: 质量
  level: 集团/工厂
  grain: group_or_plant
  definition: 车辆在用3个月内的保修索赔次数（每千台）
  formula: 3MIS索赔次数 ÷ 在用3个月车辆数 × 1000
  sql: SELECT claims*1000.0/vehicles_in_service FROM dws_plant_month / 质量月表
  source: 售后保修系统、质量系统
  refresh: 月
  owner_role: 集团质量经理
  it_role: 数据平台工程师
  dq_rule: VIN与生产工厂可关联；滞后指标
  direction: down
  unit: 次/千台
  target_text: ≤12
  warn_text: '12'
- metric_id: jph
  name: JPH达成率
  domain: 效率
  level: 工厂
  grain: plant_or_shop
  definition: 实际每小时产出与计划JPH（VCS建议档位）之比
  formula: 实际JPH ÷ 计划JPH
  sql: SELECT jph_rate FROM dws_shop_month；工厂取总装
  source: MES、计划排产（VCS输出）
  refresh: 小时
  owner_role: 工厂生产经理
  it_role: 数据平台工程师
  dq_rule: 计划JPH须取当班生效版本
  direction: up
  unit: '%'
  target_text: ≥97%
  warn_text: 95%
- metric_id: oee
  name: OEE
  domain: 效率
  level: 工厂
  grain: plant_or_shop
  definition: 设备综合效率 = 时间开动率 × 性能开动率 × 合格品率
  formula: 时间开动率 × 性能开动率 × 合格品率
  sql: SELECT oee FROM dws_shop_month；工厂为四车间产量加权或标定值
  source: MES
  refresh: 班
  owner_role: 工厂设备/TPM经理
  it_role: MES接口工程师
  dq_rule: 三项因子均在0–100%；停机原因代码非空
  direction: up
  unit: '%'
  target_text: ≥85%
  warn_text: 82%
- metric_id: ot_rate
  name: 加班率
  domain: 人力
  level: 工厂
  grain: plant_or_shop
  definition: 加班人·h 占标准工时的比例；加班人·h = 线体加班小时 × 班组人数
  formula: Σ(线体加班h × 班组人数) ÷ (在册 × 工作日 × 8h)
  sql: SELECT ot_h*100.0/std_h FROM dws_plant_month
  source: HR考勤排班、MES、VCS测算结果
  refresh: 日
  owner_role: 工厂人力资源经理
  it_role: HR接口工程师
  dq_rule: 考勤与排班一致；人均 >60 h 告警（R4）
  direction: eq
  unit: '%'
  target_text: = VCS 测算
  warn_text: 相对测算 ±2pp 内为预警，超出为红
- metric_id: shift_util
  name: 班次利用率
  domain: 效率
  level: 工厂
  grain: plant
  definition: 排班时间中实际有效生产的比例
  formula: 有效生产时间 ÷ 排班时间
  sql: SELECT SUM(run_min)*100.0/SUM(planned_min) FROM dwd_fact_production
  source: MES、HR考勤排班
  refresh: 班
  owner_role: 工厂生产经理
  it_role: 数据平台工程师
  dq_rule: 排班时间>0；有效时间≤排班时间
  direction: up
  unit: '%'
  target_text: ≥90%
  warn_text: 87%
- metric_id: buffer_days
  name: 缓冲库存天数
  domain: 物流
  level: 工厂
  grain: plant
  definition: 关键零部件（外购件）库存可支撑生产的天数；与 VCS 车间间缓存是两个指标
  formula: 库存量 ÷ 日均需求
  sql: SELECT buffer_days FROM dws_plant_month
  source: MES、ERP（仓储）
  refresh: 小时
  owner_role: 工厂物流经理
  it_role: ERP接口工程师
  dq_rule: 库存非负；日均需求取滚动7日
  direction: range
  unit: 天
  target_text: 1.5–2.5天
  warn_text: 超出区间
  range_lo: 1.5
  range_hi: 2.5
- metric_id: vcs_exec
  name: VCS方案执行率
  domain: VCS
  level: 工厂
  grain: plant_or_shop
  definition: 实际 JPH档×班次 与 VCS 推荐一致、且线体加班偏差 ≤10% 的车间天数占比
  formula: 一致车间天数 ÷ (车间数 × 工作日)
  sql: SELECT exec_days*100.0/workdays FROM dws_shop_month
  source: MES、排班、VCS测算结果
  refresh: 日
  owner_role: 工厂计划经理
  it_role: 数据平台工程师
  dq_rule: VCS方案版本可追溯；偏差需填写原因
  direction: up
  unit: '%'
  target_text: ≥90%
  warn_text: 80%
- metric_id: ftt
  name: 一次下线合格率（整车）
  domain: 质量
  level: 工厂
  grain: plant
  definition: 整车下线一次通过检验的比例
  formula: 一次合格车数 ÷ 下线车数
  sql: SELECT ftt_num*100.0/ftt_den FROM dws_plant_month
  source: MES（质量）
  refresh: 班
  owner_role: 工厂质量经理
  it_role: MES接口工程师
  dq_rule: 返修记录与下线记录可关联
  direction: up
  unit: '%'
  target_text: ≥92%
  warn_text: 90%
- metric_id: dpu
  name: 整车DPU
  domain: 质量
  level: 工厂
  grain: plant
  definition: 每台车平均缺陷数（可按车间拆分）
  formula: 缺陷总数 ÷ 下线车数
  sql: SELECT defect_qty*1.0/prod_qty FROM dws_plant_month
  source: 质量系统、MES
  refresh: 班
  owner_role: 工厂质量经理
  it_role: MES接口工程师
  dq_rule: 缺陷代码标准化；缺陷归属车间非空
  direction: down
  unit: ''
  target_text: ≤0.50
  warn_text: '0.55'
- metric_id: audit
  name: 整车Audit扣分
  domain: 质量
  level: 工厂
  grain: plant
  definition: 按整车审核标准抽检的平均扣分
  formula: ∑审核扣分 ÷ 抽检车数
  sql: SELECT audit_score*1.0/audit_cars FROM dws_plant_month
  source: 质量系统
  refresh: 日
  owner_role: 工厂质量经理
  it_role: 数据平台工程师
  dq_rule: 抽检样本量达标
  direction: down
  unit: 分/车
  target_text: ≤1.5
  warn_text: '1.5'
- metric_id: lg_ontime
  name: 供应商到货准时率
  domain: 物流
  level: 工厂
  grain: plant
  definition: 按约定窗口到货的批次比例（按批次加权）
  formula: 准时到货批次 ÷ 应到货批次
  sql: SELECT delivery_ontime*100.0/delivery_batches FROM dws_plant_month
  source: WMS、ERP
  refresh: 日
  owner_role: 工厂物流经理
  it_role: ERP接口工程师
  dq_rule: 到货窗口取当日生效版本；批次号唯一
  direction: up
  unit: '%'
  target_text: ≥95%
  warn_text: 90%
- metric_id: lineside_lt4
  name: 线边缓冲<4h零件数
  domain: 物流
  level: 工厂
  grain: plant
  definition: 线边缓冲低于4小时的关键零件数量
  formula: count（线边缓冲 < 4h 的关键零件）
  sql: SELECT lineside_lt4 FROM dws_plant_month
  source: WMS、MES
  refresh: 小时
  owner_role: 工厂物流经理
  it_role: 数据平台工程师
  dq_rule: 关键零件清单取当期生效版本
  direction: down
  unit: 个
  target_text: ≤10
  warn_text: '10'
- metric_id: en_cost
  name: 能源成本（单车）
  domain: 能源
  level: 工厂
  grain: plant
  definition: VCS 能源科目（固定+变动+加班能耗）按分时电价折算后摊到每台车
  formula: Σ电量 × 分时电价 ÷ 下线车数
  sql: SELECT energy_cost/prod_qty FROM dws_plant_month
  source: 能源计量、ERP（成本中心）
  refresh: 日
  owner_role: 工厂能源经理
  it_role: 数据平台工程师
  dq_rule: 单价取当期合同价；与财务能耗成本对账
  direction: down
  unit: 元/台
  target_text: = VCS 测算
  warn_text: 超测算 5%
- metric_id: idle_share
  name: 空载/待机能耗占比
  domain: 能源
  level: 工厂
  grain: plant_or_shop
  definition: 无车生产时（空载/待机/空烘）消耗的能源占总能耗比例
  formula: 空载/待机能耗 ÷ 总能耗
  sql: SELECT idle_kwh*100.0/elec_kwh FROM dws_plant_month
  source: 能源计量、MES
  refresh: 小时
  owner_role: 工厂能源经理
  it_role: 设备数据工程师
  dq_rule: 设备状态与过车/生产记录时间对齐
  direction: down
  unit: '%'
  target_text: ≤10%
  warn_text: 10%
- metric_id: peak_share
  name: 峰时用电占比
  domain: 能源
  level: 工厂
  grain: plant
  definition: 峰时段用电量占总用电量的比例
  formula: 峰时电量 ÷ 总电量
  sql: SELECT peak_kwh*100.0/elec_kwh FROM dws_plant_month
  source: 能源计量
  refresh: 小时
  owner_role: 工厂能源经理
  it_role: 数据平台工程师
  dq_rule: 时段定义取当期电价政策
  direction: down
  unit: '%'
  target_text: ≤32%
  warn_text: 32%
- metric_id: lab_cost
  name: 人工成本（单车，含加班）
  domain: 人力
  level: 工厂
  grain: plant
  definition: VCS 人工类科目（直接/间接人工、夜班补贴、福利社保、加班人工、超限溢价）摊到每台车
  formula: Σ人工类科目 ÷ 下线车数
  sql: SELECT SUM(amount)/prod_qty FROM dws_cost_account_month WHERE grp IN (人工,加班)
  source: HR薪酬、ERP
  refresh: 月（日预估）
  owner_role: 工厂人力资源经理
  it_role: HR接口工程师
  dq_rule: 含加班费；与财务人工成本对账
  direction: down
  unit: 元/台
  target_text: = VCS 测算
  warn_text: 超测算 5%
- metric_id: headcount
  name: 在册/出勤人数
  domain: 人力
  level: 工厂
  grain: plant
  definition: 在册人数与日均出勤人数；VCS 定员 =（每班直接定员 + 间接定员）× 班次数
  formula: 在册：期末在册人数；出勤：∑日出勤人数 ÷ 工作日数
  sql: SELECT headcount, att_present/workdays FROM dws_plant_month
  source: HR考勤排班
  refresh: 日
  owner_role: 工厂人力资源经理
  it_role: HR接口工程师
  dq_rule: 在册与组织架构一致；出勤≤在册
  direction: watch
  unit: 人
  target_text: = VCS 定员
  warn_text: —
- metric_id: attend
  name: 出勤率
  domain: 人力
  level: 工厂
  grain: plant
  definition: 实际出勤人次占应出勤人次的比例
  formula: 实际出勤人次 ÷ 应出勤人次
  sql: SELECT att_present*100.0/att_sched FROM dws_plant_month
  source: HR考勤排班
  refresh: 日
  owner_role: 工厂人力资源经理
  it_role: HR接口工程师
  dq_rule: 请假类型完整；与排班对账
  direction: up
  unit: '%'
  target_text: ≥97%
  warn_text: 95%
- metric_id: temp_share
  name: 派遣+临时占比
  domain: 人力
  level: 工厂
  grain: plant
  definition: 劳务派遣与临时用工占在册人数的比例；外包按班次计费不计入人数
  formula: (派遣 + 临时) ÷ 在册
  sql: SELECT (disp_n+temp_n)*100.0/headcount FROM dws_plant_month
  source: HR、外包管理台账
  refresh: 周
  owner_role: 工厂人力资源经理
  it_role: HR接口工程师
  dq_rule: 派遣单列，>10% 红色告警（法规上限）
  direction: down
  unit: '%'
  target_text: ≤20%（派遣≤10%）
  warn_text: 20%
- metric_id: smed
  name: 换模时间
  domain: 冲压
  level: 车间
  grain: shop
  definition: 从最后一件合格件到换模后首件合格件的时间
  formula: ∑换模时长 ÷ 换模次数
  sql: SELECT AVG(minutes) FROM dwd_fact_die_change
  source: MES、设备数据
  refresh: 班
  owner_role: 冲压车间主任
  it_role: MES接口工程师
  dq_rule: 单次时长0–120分钟
  direction: down
  unit: 分钟/次
  target_text: ≤10
  warn_text: '10'
- metric_id: die_util
  name: 模具稼动率
  domain: 冲压
  level: 车间
  grain: shop
  definition: 模具实际生产时间占计划可用时间的比例
  formula: 模具生产时间 ÷ 计划可用时间
  sql: SELECT SUM(die_run_min)*100.0/SUM(die_avail_min) FROM dwd_fact_press
  source: MES
  refresh: 班
  owner_role: 冲压车间主任
  it_role: MES接口工程师
  dq_rule: 模具编号与主数据一致
  direction: up
  unit: '%'
  target_text: ≥85%
  warn_text: 83%
- metric_id: spm
  name: 冲次达成率（SPM）
  domain: 冲压
  level: 车间
  grain: shop
  definition: 实际冲次与设计冲次之比
  formula: 实际SPM ÷ 设计SPM
  sql: SELECT SUM(actual_strokes)*100.0/SUM(design_strokes) FROM dwd_fact_press
  source: MES、设备数据
  refresh: 小时
  owner_role: 冲压车间主任
  it_role: MES接口工程师
  dq_rule: 设计SPM取设备主数据
  direction: up
  unit: '%'
  target_text: ≥90%
  warn_text: 88%
- metric_id: st_q
  name: 冲压件合格率
  domain: 冲压
  level: 车间
  grain: shop
  definition: 冲压件一次检验合格比例
  formula: 合格件数 ÷ 生产件数
  sql: SELECT SUM(good_parts)*100.0/SUM(parts) FROM dwd_fact_press
  source: MES（质量）
  refresh: 班
  owner_role: 冲压车间质量工程师
  it_role: MES接口工程师
  dq_rule: 报废与返修分类完整
  direction: up
  unit: '%'
  target_text: ≥99%
  warn_text: 98.8%
- metric_id: robot_down
  name: 机器人停机时长
  domain: 焊装
  level: 车间
  grain: shop
  definition: 机器人故障导致的累计停机时间
  formula: ∑机器人故障停机分钟
  sql: SELECT SUM(minutes) FROM dwd_fact_downtime WHERE reason='机器人故障'
  source: MES、设备PLC数据
  refresh: 小时
  owner_role: 焊装车间主任
  it_role: 设备数据工程师
  dq_rule: 停机原因代码非空；与Andon记录对账
  direction: down
  unit: 分钟/班
  target_text: ≤20
  warn_text: '20'
- metric_id: takt
  name: 节拍达成率
  domain: 效率
  level: 车间
  grain: shop
  definition: 设计节拍与实际平均节拍之比
  formula: 设计节拍 ÷ 实际平均节拍
